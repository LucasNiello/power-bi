<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0B"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.08" cy="0" r="0.6">
      <stop offset="0" stop-color="#1DB954" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1DB954" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kpiAtivo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1ED760"/>
      <stop offset="1" stop-color="#169C46"/>
    </linearGradient>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1DB954" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Moldura -->
  <rect width="1280" height="720" fill="#050505"/>
  <rect x="8" y="8" width="1264" height="704" rx="22" fill="url(#bg)" stroke="#1F1F1F" stroke-width="1.5"/>
  <rect x="8" y="8" width="1264" height="704" rx="22" fill="url(#glow)"/>

  <!-- Título -->
  <text x="640" y="56" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="40" fill="#FFFFFF">Análise <tspan fill="#1DB954">-</tspan> Spotify</text>

  <!-- Área do logo (canto superior direito) -->
  <g transform="translate(1092,20)">
    <rect x="2" y="2" width="48" height="48" rx="12" fill="#1DB954"/>
    <!-- barras de equalizador -->
    <g fill="#0B0B0B">
      <rect x="11" y="24" width="5" height="16" rx="2.5"/>
      <rect x="19" y="14" width="5" height="26" rx="2.5"/>
      <rect x="27" y="19" width="5" height="21" rx="2.5"/>
      <rect x="35" y="10" width="5" height="30" rx="2.5"/>
    </g>
    <text x="60" y="25" font-family="Poppins" font-weight="700" font-size="17" fill="#FFFFFF">Music</text>
    <text x="60" y="44" font-family="Poppins" font-weight="700" font-size="17" fill="#1DB954">Insights</text>
    <line x1="60" y1="2" x2="160" y2="2" stroke="#1DB954" stroke-width="1.5"/>
    <line x1="60" y1="52" x2="160" y2="52" stroke="#1DB954" stroke-width="1.5"/>
  </g>

  <!-- KPI 1 (destaque) -->
  <g filter="url(#sombra)">
    <rect x="24" y="82" width="300" height="95" rx="16" fill="url(#kpiAtivo)"/>
    <rect x="340" y="82" width="295" height="95" rx="16" fill="#181818" stroke="#262626"/>
    <rect x="651" y="82" width="295" height="95" rx="16" fill="#181818" stroke="#262626"/>
    <rect x="962" y="82" width="295" height="95" rx="16" fill="#181818" stroke="#262626"/>
  </g>

  <!-- Caixas dos ícones -->
  <rect x="34" y="92" width="72" height="74" rx="12" fill="#0B0B0B" fill-opacity="0.85"/>
  <rect x="354" y="92" width="72" height="74" rx="12" fill="#242424"/>
  <rect x="665" y="92" width="72" height="74" rx="12" fill="#242424"/>
  <rect x="976" y="92" width="72" height="74" rx="12" fill="#242424"/>

  <!-- Ícone 1: play (streams) -->
  <g transform="translate(70,129)" fill="none" stroke="#1DB954" stroke-width="2.6" stroke-linejoin="round">
    <circle r="20"/>
    <path d="M-6 -10 L11 0 L-6 10 Z" fill="#1DB954"/>
  </g>

  <!-- Ícone 2: fone (ouvintes) -->
  <g transform="translate(390,129)" fill="none" stroke="#B3B3B3" stroke-width="2.6" stroke-linecap="round">
    <path d="M-18 6 V0 A18 18 0 0 1 18 0 V6"/>
    <rect x="-21" y="3" width="9" height="16" rx="3.5" fill="#B3B3B3"/>
    <rect x="12" y="3" width="9" height="16" rx="3.5" fill="#B3B3B3"/>
  </g>

  <!-- Ícone 3: microfone (artistas) -->
  <g transform="translate(701,129)" fill="none" stroke="#B3B3B3" stroke-width="2.6" stroke-linecap="round">
    <rect x="-7" y="-20" width="14" height="24" rx="7"/>
    <path d="M-13 -2 A13 13 0 0 0 13 -2"/>
    <line x1="0" y1="11" x2="0" y2="19"/>
    <line x1="-8" y1="19" x2="8" y2="19"/>
  </g>

  <!-- Ícone 4: playlist (músicas) -->
  <g transform="translate(1012,129)" fill="none" stroke="#B3B3B3" stroke-width="2.6" stroke-linecap="round">
    <line x1="-19" y1="-14" x2="7" y2="-14"/>
    <line x1="-19" y1="-5" x2="7" y2="-5"/>
    <line x1="-19" y1="4" x2="-3" y2="4"/>
    <line x1="14" y1="-16" x2="14" y2="10"/>
    <path d="M14 -16 L21 -12"/>
    <circle cx="9" cy="12" r="5" fill="#B3B3B3"/>
  </g>

  <!-- Painéis de visuais -->
  <g filter="url(#sombra)">
    <rect x="24" y="198" width="475" height="500" rx="16" fill="#181818" stroke="#262626"/>
    <rect x="512" y="198" width="745" height="236" rx="16" fill="#181818" stroke="#262626"/>
    <rect x="512" y="445" width="356" height="253" rx="16" fill="#181818" stroke="#262626"/>
    <rect x="881" y="445" width="376" height="253" rx="16" fill="#181818" stroke="#262626"/>
  </g>
</svg>
